<!doctype html>
<html lang="en">
  <!--? ========== Start Head ========== -->

  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact Manager | Dashboard</title>

    <!-- Favicon -->

    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon"
    />

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Remix Icons -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="dashboard.css" />
  </head>

  <!--? ========== End Head ========== -->

  <body>
    <!--***** ========== Start Main ========== *****-->

    <main>
      <section class="section-dashboard">
        <div class="container">
          <!--===== Dashboard Header =====-->

          <header class="dashboard-header">
            <a href="index.html" class="brand">
              <div class="logo">
                <i class="ri-contacts-book-3-line"></i>
              </div>

              <h2>Contact Manager</h2>
            </a>

            <div class="user-area">
              <div class="user-info">
                <i class="ri-user-line"></i>

                <span class="user-name"></span>
              </div>

              <button class="btn logout-btn logout-btn">
                <i class="ri-logout-box-r-line"></i>
                Logout
              </button>
            </div>
          </header>

          <!--===== Welcome Section =====-->

          <section class="welcome-card">
            <div>
              <h1 class="common-heading user-greeting"></h1>

              <p class="common-para">
                Manage your contacts securely and keep your information
                organized.
              </p>
            </div>

            <div class="welcome-icon">
              <i class="ri-contacts-book-line"></i>
            </div>
          </section>

          <!--===== Contact Section =====-->

          <section class="contact-section">
            <div class="contact-header">
              <h2>My Contacts</h2>

              <a href="addcontact.html" class="btn btn-primary addcontact-btn">
                <i class="ri-add-line"></i>

                Add Contact
              </a>
            </div>

            <!-- Search Box -->

            <div class="search-box">
              <i class="ri-search-line"></i>

              <input
                type="search"
                placeholder="Search by name or phone number..."
              />
            </div>

            <!-- Contact List -->

            <div class="contact-list">
              <!--===== Contact Card =====-->

              <!-- <article class="contact-card">
                <div class="contact-image">
                  <img src="" alt="Profile Picture" />
                </div>

                <div class="contact-details">
                  <h3>Ali Khan</h3>

                  <p class="job-title">Frontend Developer</p>

                  <div class="contact-info">
                    <p>
                      <i class="ri-mail-line"></i>

                      ali@gmail.com
                    </p>

                    <p>
                      <i class="ri-phone-line"></i>

                      0300-1234567
                    </p>

                    <p>
                      <i class="ri-phone-fill"></i>

                      0312-9876543
                    </p>

                    <p>
                      <i class="ri-building-line"></i>

                      ABC Technologies
                    </p>

                    <p>
                      <i class="ri-map-pin-line"></i>

                      Karachi, Pakistan
                    </p>
                  </div>
                </div>

                <!-- Actions -->

                <!-- <div class="contact-actions">
                  <a href="contactdetails.html" class="action-btn view-btn">
                    <i class="ri-eye-line"></i>

                    View
                  </a>

                  <a href="editcontact.html" class="action-btn edit-btn">
                    <i class="ri-edit-line"></i>

                    Edit
                  </a>

                  <button class="action-btn delete-btn">
                    <i class="ri-delete-bin-line"></i>

                    Delete
                  </button>
                </div>
              </article> --> 
            </div>

            <!--===== Empty State =====-->

            <div class="contact-empty">
              <i class="ri-contacts-book-line"></i>

              <h3>No Contacts Found</h3>

              <p>Add your first contact to start managing.</p>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>

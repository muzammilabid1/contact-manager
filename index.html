<!DOCTYPE html>
<html lang="en">
  <!--? ========== Start Head ========== -->

  <head>
    <!--* ========== Meta Tags ========== -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--* ========== Title ========== -->

    <title>Contact Manager</title>

    <!--* ========== Favicon ========== -->

    <link
      rel="shortcut icon"
      href="./assets/images/favicon.png"
      type="image/x-icon"
    />

    <!--* ========== Google Fonts ========== -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--* ========== Remix Icons ========== -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    />

    <!--* ========== CSS ========== -->

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="index.css" />
  </head>

  <!--? ========== End Head ========== -->

  <body>
    <!--***** ========== Start Main ========== *****-->

    <main>
      <!--===== Start Hero Section =====-->

      <section class="section-hero">
        <div class="container">
          <div class="hero-wrapper">
            <!-- Hero Icon -->

            <div class="hero-logo">
              <i class="ri-contacts-book-3-line"></i>
            </div>

            <!-- Hero Content -->

            <div class="hero-content">
              <h1 class="common-heading">
                Welcome to <span>Contact Manager</span>
              </h1>

              <p class="common-para">
                Organize your personal and professional contacts in one secure
                place. Easily add, update, search, and manage your contact list
                anytime.
              </p>
            </div>

            <!-- Hero Buttons -->

            <div class="hero-btns">
              <a href="login.html" class="btn btn-primary">
                <i class="ri-login-circle-line"></i>

                Login
              </a>

              <a href="signup.html" class="btn btn-secondary">
                <i class="ri-user-add-line"></i>

                Create Account
              </a>
            </div>
          </div>
        </div>
      </section>

      <!--===== End Hero Section =====-->
    </main>

    <script src="main.js"></script>
    <!--***** ========== End Main ========== *****-->
  </body>
</html>

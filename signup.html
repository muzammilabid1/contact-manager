<!DOCTYPE html>
<html lang="en">
  <!--? ========== Start Head ========== -->

  <head>
    <!--* ========== Meta Tags ========== -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--* ========== Title ========== -->

    <title>Contact Manager | Sign Up</title>

    <!--* ========== Favicon ========== -->

    <link rel="shortcut icon" href="./assets/images/favicon.png" type="image/x-icon" />

    <!--* ========== Google Fonts ========== -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--* ========== Remix Icons ========== -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    />

    <!--* ========== CSS ========== -->

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="signup.css" />
  </head>

  <!--? ========== End Head ========== -->

  <body>
    <!--***** ========== Start Main ========== *****-->

    <main>
      <!--===== Start Signup Section =====-->

      <section class="section-signup">
        <div class="container">
          <div class="signup-wrapper">
            <!--===== Signup Header =====-->

            <div class="signup-content">
              <div class="logo">
                <i class="ri-contacts-book-3-line"></i>
              </div>

              <h1 class="common-heading">Create Your Account</h1>

              <p class="common-para">
                Sign up to manage your contacts securely.
              </p>
            </div>

            <!--===== Signup Form =====-->

            <form class="signup-form" autocomplete="off">
              <!-- Full Name -->

              <div class="input-group">
                <label for="full-name">Full Name</label>

                <div class="input-field">
                  <i class="ri-user-3-line"></i>

                  <input
                    type="text"
                    id="full-name"
                    placeholder="Enter your full name"
                    required
                  />
                </div>
              </div>

              <!-- Email -->

              <div class="input-group">
                <label for="email">Email Address</label>

                <div class="input-field">
                  <i class="ri-mail-line"></i>

                  <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                  />
                </div>
              </div>

              <!-- Password -->

              <div class="input-group">
                <label for="password">Password</label>

                <div class="input-field">
                  <i class="ri-lock-2-line"></i>

                  <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                  />

                  <button
                    type="button"
                    class="password-toggle"
                    aria-label="Toggle password visibility"
                  >
                    <i class="ri-eye-line"></i>
                  </button>
                </div>
              </div>

              <!-- Confirm Password -->

              <div class="input-group">
                <label for="confirm-password">Confirm Password</label>

                <div class="input-field">
                  <i class="ri-lock-password-line"></i>

                  <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm password"
                    required
                  />

                  <button
                    type="button"
                    class="password-toggle"
                    aria-label="Toggle password visibility"
                  >
                    <i class="ri-eye-line"></i>
                  </button>
                </div>
              </div>

              <!-- Submit Button -->

              <button type="submit" class="btn btn-primary signup-btn" >
                Create Account
              </button>

              <!-- Login Link -->

              <p class="account-link">
                Already have an account?

                <a href="login.html">Login</a>
              </p>
            </form>
          </div>
        </div>
      </section>

      <!--===== End Signup Section =====-->
    </main>

    <!--***** ========== End Main ========== *****-->

    <script src="main.js"></script>
  </body>
</html>
